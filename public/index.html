<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QA Agent</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0c66e4">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="logo" aria-hidden="true">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3 3 7-7"/></svg>
  </div>
  <span class="brand">QA Agent</span>
  <span class="topbar-sub">Autonomous QA</span>
  <span class="spacer"></span>
  <button id="updatePill" class="update-pill" type="button" hidden aria-haspopup="dialog">Update available</button>
  <button id="gear" class="gear" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="connPanel" aria-label="Connections">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    <span class="dot checking" id="gearDot" aria-hidden="true"></span>
  </button>
</header>
<div class="app">
  <aside class="side">
    <h2 class="side-title">Projects</h2>
    <div class="tools">
      <label class="sr" for="projSearch">Search projects</label>
      <input type="search" id="projSearch" placeholder="Search projects" autocomplete="off">
      <label class="sr" for="projSort">Sort projects</label>
      <select id="projSort">
        <option value="az">Name A–Z</option>
        <option value="za">Name Z–A</option>
        <option value="new">Newest first</option>
        <option value="old">Oldest first</option>
      </select>
    </div>
    <nav id="projects" aria-label="Projects"></nav>
    <button id="newProject" class="btn block">+ New project</button>
  </aside>
  <main id="main" tabindex="-1"></main>
</div>
<div id="connPanel" class="conn-panel" role="dialog" aria-label="Connections" hidden></div>
<div id="updateModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="updateTitle" hidden></div>
<div id="welcome" class="modal" role="dialog" aria-modal="true" aria-labelledby="welcomeTitle" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
